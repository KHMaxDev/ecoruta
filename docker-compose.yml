# =============================================================================
# EcoRuta — Orquestación de Infraestructura Base
# PostgreSQL 16 + PostGIS 3.4 + pgRouting 3.6 | Redis 7.4 | Valhalla (México)
# =============================================================================
# Uso:
#   docker compose up -d postgis redis valhalla
#   docker compose logs -f valhalla   # la primera vez descarga/build los tiles
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Base de datos geoespacial y topológica
  # ---------------------------------------------------------------------------
  postgis:
    image: pgrouting/pgrouting:16-3.4-3.6.1
    container_name: ecoruta_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoruta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoruta_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecoruta_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/001_init_db.sql:ro
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoruta_user} -d ${POSTGRES_DB:-ecoruta_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Caché de consultas de rutas y colas de tareas
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: ecoruta_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Motor de enrutamiento base con Dynamic Costing y elevación (México)
  # ---------------------------------------------------------------------------
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: ecoruta_valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla_tiles:/custom_files
    environment:
      - tile_urls=https://download.geofabrik.de/north-america/mexico-latest.osm.pbf
      - use_tiles_ignore_pbf=True
      - build_elevation=True
      - build_admins=True
      - build_time_zones=True
      - serve_tiles=True
      - server_threads=2

  # ---------------------------------------------------------------------------
  # Backend FastAPI + núcleo Rust (se activa en Fase 6)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ecoruta_backend
    restart: unless-stopped
    profiles: ["full"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecoruta_user}:${POSTGRES_PASSWORD:-ecoruta_secure_password}@postgis:5432/${POSTGRES_DB:-ecoruta_db}
      REDIS_URL: redis://redis:6379/0
      VALHALLA_URL: http://valhalla:8002
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
